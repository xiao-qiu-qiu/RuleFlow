dns:
    enable: true
    listen: 127.0.0.1:1053
    ipv6: true
    ipv6-timeout: 300
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    cache-algorithm: arc
    prefer-h3: false
    use-hosts: true
    use-system-hosts: true
    fake-ip-filter-mode: blacklist
    fake-ip-filter:
        - '*.lan'
        - '*.localdomain'
        - '*.example'
        - '*.invalid'
        - '*.localhost'
        - '*.test'
        - '*.local'
        - '*.home.arpa'
        - '+.local'
        - '+.localhost'
        - 'time.*.com'
        - 'time.*.gov'
        - 'time.*.edu.cn'
        - 'time.*.apple.com'
        - 'time-ios.apple.com'
        - 'time1.*.com'
        - 'time2.*.com'
        - 'time3.*.com'
        - 'time4.*.com'
        - 'time5.*.com'
        - 'time6.*.com'
        - 'time7.*.com'
        - 'ntp.*.com'
        - '+.pool.ntp.org'
        - '+.stun.*.*'
        - '+.stun.*.*.*'
        - '+.stun.*.*.*.*'
        - '+.stun.*.*.*.*.*'
        - '+.stun.*.*.*.*.*.*'
        - 'localhost.ptlogin2.qq.com'
        - '+.msftconnecttest.com'
        - '+.msftncsi.com'
        - 'captive.apple.com'
        - 'connectivitycheck.gstatic.com'
        - 'connectivitycheck.android.com'
        - '*.n.n.srv.nintendo.net'
        - '+.srv.nintendo.net'
        - 'xbox.*.*.microsoft.com'
        - '*.*.xboxlive.com'
        - '+.xboxlive.com'
        - 'rule-set:fake_ip_filter_private'
    respect-rules: true
    default-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    nameserver:
        - https://cloudflare-dns.com/dns-query#RULES
        - https://dns.google/dns-query#RULES
    proxy-server-nameserver:
        - https://dns.alidns.com/dns-query#DIRECT
        - https://doh.pub/dns-query#DIRECT
    direct-nameserver:
        - https://dns.alidns.com/dns-query#DIRECT
        - https://doh.pub/dns-query#DIRECT
    direct-nameserver-follow-policy: true
    nameserver-policy:
        "rule-set:cn_domain":
            - https://dns.alidns.com/dns-query#DIRECT
            - https://doh.pub/dns-query#DIRECT
        "+.cn":
            - https://dns.alidns.com/dns-query#DIRECT
            - https://doh.pub/dns-query#DIRECT
        "sub.xqqq.ccwu.cc,www.stellar.cc.cd,+.jsdelivr.net":
            - https://dns.alidns.com/dns-query#DIRECT
            - https://doh.pub/dns-query#DIRECT
        "+.8008205555.cn,+.8008205555.com,+.cignacmb-ipmi.com,+.cignacmb.com,+.cignacmbamc.com,+.cmb-leasing.com,+.cmbchina.biz,+.cmbchina.cn,+.cmbchina.com,+.cmbimg.cn,+.cmbimg.com,+.cmbt.cn,+.cmbuat.com,+.cmburl.cn,+.cmf.biz,+.cmf.ltd,+.cmfchina.com,+.cmfunds.cn,+.test-cignacmb.com,+.joying.com":
            - https://dns.alidns.com/dns-query#DIRECT
            - https://doh.pub/dns-query#DIRECT

allow-lan: false
mode: Rule
external-controller: 127.0.0.1:7892
port: 7890
socks-port: 7891
ipv6: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
tun:
  enable: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
proxies: []
proxy-groups:
  - type: select
    name: 🎯 Manual
    proxies:
      - __NODES__
  - type: url-test
    name: ⚡ Auto
    proxies:
      - __NODES__
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    lazy: true
    expected-status: 204
  - type: select
    name: 🚀 Proxy
    default-selected: 🎯 Manual
    proxies:
      - 🎯 Manual
      - ⚡ Auto
      - __NODES__
      - DIRECT
  - type: select
    name: 📺 Stream
    default-selected: 🎯 Manual
    proxies:
      - 🎯 Manual
      - 🚀 Proxy
      - ⚡ Auto
      - __NODES__
      - DIRECT
  - type: select
    name: 🤖 AI
    default-selected: 🎯 Manual
    proxies:
      - 🎯 Manual
      - 🚀 Proxy
      - ⚡ Auto
      - __NODES__
      - DIRECT
