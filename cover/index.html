<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="个人静态存档页，放一些零散的摘录与随笔。" />
    <title>拾零 · 静态存档</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #23252b;
        --muted: #6b7280;
        --line: #e5e7eb;
        --bg: #fbfbfa;
        --link: #2f6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e7ea;
          --muted: #9aa0aa;
          --line: #2c2f36;
          --bg: #16181d;
          --link: #7aa7ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 4rem 1.5rem 6rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.75 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { max-width: 40rem; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .02em; }
      .sub { color: var(--muted); font-size: .9rem; margin-bottom: 2.5rem; }
      h2 { font-size: 1rem; margin: 2.5rem 0 .75rem; }
      p { margin: 0 0 1rem; }
      ul { padding-left: 1.1rem; margin: 0; }
      li { margin: .3rem 0; }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
      footer { color: var(--muted); font-size: .85rem; margin-top: 3rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>拾零</h1>
      <div class="sub">一个放零散摘录和随笔的静态页</div>

      <p>
        这里不常更新。大多是随手记下来的句子和短文，攒到一定数量就整理一次，
        放在这儿当个归档，省得散在备忘录里翻不到。
      </p>

      <h2>近来的摘录</h2>
      <ul>
        <li>「把复杂的事情写清楚，是一种被低估的能力。」</li>
        <li>「慢一点没关系，方向对就行。」</li>
        <li>「记录不是为了证明什么，是为了下次不用重新想一遍。」</li>
      </ul>

      <h2>随手写的</h2>
      <p>
        天冷了之后，写字的速度会慢下来。慢下来也好，很多想法需要一点停顿才成型。
        剩下的就交给时间，不着急。
      </p>

      <hr />

      <h2>说明</h2>
      <p>本站为个人静态存档，不提供评论、投稿或转载授权，内容不构成任何建议。</p>

      <footer>拾零 · 静态存档</footer>
    </main>
  </body>
</html>
